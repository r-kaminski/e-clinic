<body>
    <header class="site-navbar py-1" id= "my-header" role="banner">

      <div class="container">
        <div class="row align-items-center">
          
          <div class="col-6 col-xl-2">
            <h1 class="mb-0"><a href="{% url 'webapp:index' %}" class="text-black h2 mb-0">znajdz<strong>Lekarza</strong></a></h1>
          </div>

          <div class="col-10 col-xl-10 d-none d-xl-block">
            <nav class="site-navigation text-right" role="navigation">

              <ul class="site-menu js-clone-nav mr-auto d-none d-lg-block">
                <li class="active"><a href="{% url 'webapp:index' %}">Strona główna</a></li>

        		{% else %}

    			{% endif %}
              </ul>
            </nav>
          </div>

          <div class="col-6 col-xl-2 text-right d-block">
            
            <div class="d-inline-block d-xl-none ml-md-0 mr-auto py-3" style="position: relative; top: 3px;"><a href="#" class="site-menu-toggle js-menu-toggle text-black"><span class="icon-menu h3"></span></a></div>

          </div>

        </div>
      </div>
     
    </header>

	<div id="booking" class="section">
		<div class="section-center">
			<div class="container">
				<div class="row">
					<div class="col-md-7 col-md-push-5">
						<div class="booking-cta">
							<h1>Zarezerwuj</h1>
							<h1>wizytę</h1>
						</div>
					</div>
					<div class="col-md-4 col-md-pull-7">
						<div class="booking-form">
							<form>
								<div class="form-group">
									<span class="form-label">Specjalizacja</span>
									<select class="form-control" name="specialization">
										<option value="" selected disabled>Wybierz</option>
										<option>Ortopeda</option>
										<option>Okulista</option>
										<option>Chirurg</option>
									</select>
									<span class="select-arrow"></span>
										</div>
								<div class="form-group">
									<span class="form-label">Miasto</span>
									<input class="form-control" type="text" name="city" placeholder="np. Wrocław, Warszawa, Gdańsk">
								</div>
								<div class="row">
									<div class="col-sm-6">
										<div class="form-group">
											<span class="form-label">Termin od:</span>
											<input class="form-control" type="date" name="start-date">
										</div>
									</div>
									<div class="col-sm-6">
										<div class="form-group">
											<span class="form-label">Termin do:</span>
											<input class="form-control" type="date" name="end-date">
										</div>
									</div>
								</div>

								<div class="form-btn">
									<button class="submit-btn" type="submit"><a href="{% url 'webapp:search' %}">Szukaj wolnych terminów</a></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
