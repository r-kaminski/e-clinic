<body>
	<header class="site-navbar py-1" id= "my-header" role="banner">

      <div class="container">
        <div class="row align-items-center">
          
          <div class="col-6 col-xl-2">
            <h1 class="mb-0"><a href="{% url 'webapp:index' %}" class="text-black h2 mb-0">znajdz<strong>Lekarza</strong></a></h1>
          </div>

          <div class="col-10 col-xl-10 d-none d-xl-block">
            <nav class="site-navigation text-right" role="navigation">

              <ul class="site-menu js-clone-nav mr-auto d-none d-lg-block">
                <li class="active"><a href="{% url 'webapp:index' %}">Strona główna</a></li>
   				<!-- <li><a href="{% url 'webapp:login' %}">Konto</a></li> -->
   				{% if user.is_authenticated %}
        			<li><a href="{% url 'webapp:logout' %}">Wyloguj</a></li>
        		{% else %}
        			<li><a href="{% url 'webapp:login' %}">Konto</a></li>
    			{% endif %}
              </ul>
            </nav>
          </div>

          <div class="col-6 col-xl-2 text-right d-block">
            
            <div class="d-inline-block d-xl-none ml-md-0 mr-auto py-3" style="position: relative; top: 3px;"><a href="#" class="site-menu-toggle js-menu-toggle text-black"><span class="icon-menu h3"></span></a></div>

          </div>

        </div>
      </div>
     
    </header>
	<div class="limiter" id="login-form-background">
		<div class="container-login100">
			<div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-50">
	
				<form class="login100-form validate-form" method="post">
					{% csrf_token %}
					<span class="login100-form-title p-b-33">
						Logowanie
					</span>

		          <div class="wrap-input100 validate-input" data-validate = "To pole jest wymagane">
		            <input class="input100" type="text" name="username" autofocus required id="id_username" placeholder="Nazwa">
		            <span class="focus-input100-1"></span>
		            <span class="focus-input100-2"></span>
		          </div>

		          <div class="wrap-input100 rs1 validate-input" data-validate="Hasło jest wymagane">
		            <input class="input100" type="password" name="password" required id="id_password" placeholder="Hasło">
		            <span class="focus-input100-1"></span>
		            <span class="focus-input100-2"></span>
		          </div>

					<div class="container-login100-form-btn m-t-20">
						<button class="login100-form-btn" type="submit">
							Zaloguj się
						</button>
					</div>

					<div class="text-center p-t-45 p-b-4">
						<span class="txt1">Nie masz konta? </span><a href="{% url 'webapp:register' %}" class="txt2 hov1">Zarejestruj się!</a>
						<spac class="txt1"> 
					</div>
				</form>
				
			</div>
		</div>
	</div>
