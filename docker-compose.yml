version: "3.2"
services:
  web:
    build:
      context: ./mysite
    volumes:
      - ./mysite:/mysite
    networks:
      - main
    depends_on:
      - db
  db:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    networks:
      - main
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 80:80
    networks:
      - main
    depends_on:
      - web
networks:
  main: